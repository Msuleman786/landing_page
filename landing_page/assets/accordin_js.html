<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vanilla JS Accordion</title>
  <style>
    .accordion-item { margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .header {
      padding: 16px;
      background: #eee;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .content {
      padding: 0 16px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }
    .content.show {
      max-height: 500px; /* big enough or use JS to calculate */
      padding: 16px;
    }
  </style>
</head>
<body>

  <div class="accordion">
    <div class="accordion-item">
      <div class="header">Section 1<span>+</span></div>
      <div class="content">Content 1...</div>
    </div>
    <div class="accordion-item">
      <div class="header">Section 2<span>+</span></div>
      <div class="content">Content 2...</div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.header').forEach(header => {
      header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        const isOpen = content.classList.contains('show');

        // Close all others (optional – remove if you want multiple open)
        document.querySelectorAll('.content.show').forEach(c => {
          if (c !== content) {
            c.classList.remove('show');
            c.previousElementSibling.querySelector('span').textContent = '+';
          }
        });

        // Toggle current
        content.classList.toggle('show');
        header.querySelector('span').textContent = isOpen ? '+' : '−';
      });
    });
  </script>

</body>
</html>
